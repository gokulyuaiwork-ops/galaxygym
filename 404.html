<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galaxy Gym &middot; Redirecting...</title>
  <meta property="og:title" content="🏆 Galaxy Gym &middot; Official Attendance Leaderboard">
  <meta property="og:description" content="View workout streaks, monthly consistency rankings & 3-Star champions! Consistency beats intensity. 💪🌟">
  
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 440px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .badge {
      display: inline-block;
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid #334155;
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 12px 24px;
      border-radius: 10px;
      margin-top: 15px;
    }
  </style>

  <script>
    (function() {
      const BASE_TUNNEL = "https://locking-tiny-topic-drawings.trycloudflare.com";
      const fullPath = window.location.pathname; // e.g. /galaxygym/leaderboard/share/rolling
      // Remove repository base (/galaxygym)
      const subPath = fullPath.replace(/^\/galaxygym/, "");
      
      let targetUrl = BASE_TUNNEL + (subPath.startsWith("/") ? subPath : "/" + subPath);
      if (subPath === "" || subPath === "/") {
        targetUrl = BASE_TUNNEL + "/leaderboard/share/rolling";
      }
      if (window.location.search) {
        targetUrl += window.location.search;
      }

      document.addEventListener("DOMContentLoaded", function() {
        const btn = document.getElementById("redirectBtn");
        if (btn) btn.href = targetUrl;
      });

      window.location.replace(targetUrl);
    })();
  </script>
</head>
<body>
  <div class="card">
    <div class="badge">GALAXY GYM</div>
    <div class="spinner"></div>
    <h2 style="margin: 0 0 8px;">Opening Leaderboard...</h2>
    <p style="color: #94a3b8; font-size: 14px; margin: 0 0 16px;">Loading Galaxy Gym consistency ranking & stars.</p>
    <a id="redirectBtn" class="btn" href="https://locking-tiny-topic-drawings.trycloudflare.com/leaderboard/share/rolling">
      Click to Open Now &rarr;
    </a>
  </div>
</body>
</html>
