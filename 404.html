<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galaxy Fitness &middot; Loading...</title>
  <script>
    (function() {
      const p = window.location.pathname.toLowerCase();
      const s = window.location.search || "";
      if (p.includes("dashboard") || p.includes("leaderboard") || p.includes("share") || p.includes("rolling")) {
        window.location.replace("/dashboard" + s);
      } else {
        window.location.replace("/" + s);
      }
    })();
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 60px 20px; background: #f8fafc; color: #0f172a;">
  <p style="font-size: 16px; font-weight: 600;">Loading Galaxy Fitness...</p>
</body>
</html>
